name: Publish AUR packages

# Mirrors the packages of a released manifest to the AUR (`yay -Syu`). Called by release.yml after a
# complete Stable train, and runnable by hand with the manifest of an already released train.
# It never blocks a release: without the AUR_SSH_KEY secret it only prints a warning.
on:
  workflow_call:
    inputs:
      manifest:
        description: Released manifest path, for example manifests/stable/2026.10.2.json
        required: true
        type: string
      channel:
        description: stable publishes every package and the -beta variants; beta only the -beta variants
        required: false
        default: stable
        type: string
  workflow_dispatch:
    inputs:
      manifest:
        description: Released manifest path, for example manifests/stable/2026.10.2.json
        required: true
        type: string
      channel:
        description: stable publishes every package and the -beta variants; beta only the -beta variants
        required: false
        default: stable
        type: choice
        options: [stable, beta]

permissions:
  contents: read

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish AUR packages from the released manifest
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          RELEASE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::AUR_SSH_KEY is not configured; skipping AUR publication"
            exit 0
          fi
          pacman -Syu --noconfirm --needed python git openssh
          useradd --create-home builder
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" >/home/builder/.ssh/aur_key
          chown builder:builder /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key
          chown -R builder:builder "$GITHUB_WORKSPACE"
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Validate the caller-supplied manifest before using it. Resolve symlinks
          # and require a direct JSON file in the selected channel directory.
          case "$RELEASE_CHANNEL" in
            stable|beta) ;;
            *) echo "Unsupported release channel: $RELEASE_CHANNEL" >&2; exit 64 ;;
          esac
          manifest_dir="$(realpath -e -- "manifests/$RELEASE_CHANNEL")"
          manifest_path="$(realpath -e -- "$RELEASE_MANIFEST")"
          if [[ "$(dirname "$manifest_path")" != "$manifest_dir" || "$manifest_path" != *.json ]]; then
            echo "Manifest must be a direct JSON file in manifests/$RELEASE_CHANNEL" >&2
            exit 64
          fi
          python scripts/validate_manifest.py "$manifest_path" --channel "$RELEASE_CHANNEL"

          if [ "$RELEASE_CHANNEL" = beta ]; then
            # A Beta release: the -beta packages only, compared with the newest Stable manifest.
            stable="$(find manifests/stable -maxdepth 1 -type f -name '*.json' -print | sort -V | tail -1)"
            test -n "$stable"
            python scripts/validate_manifest.py "$stable" --channel stable
            runuser -u builder -- env HOME=/home/builder USER=builder LOGNAME=builder AUR_SSH_KEY_FILE=/home/builder/.ssh/aur_key \
              python scripts/publish_aur.py publish "$stable" /home/builder/aur \
              --also "$manifest_path" --beta-manifest "$manifest_path" --beta-only --push
          else
            latest_beta="$(find manifests/beta -maxdepth 1 -type f -name '*.json' -print | sort -V | tail -1)"
            test -n "$latest_beta"
            python scripts/validate_manifest.py "$latest_beta" --channel beta
            runuser -u builder -- env HOME=/home/builder USER=builder LOGNAME=builder AUR_SSH_KEY_FILE=/home/builder/.ssh/aur_key \
              python scripts/publish_aur.py publish "$manifest_path" /home/builder/aur \
              --also "$latest_beta" --beta-manifest "$latest_beta" --push
          fi
