name: MeoArch repository release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable builds a complete train unless candidate is set; Beta always builds one sparse candidate.
        required: true
        type: choice
        options: [stable, beta]
      manifest:
        description: Reviewed immutable manifest path for this exact release attempt; no historical manifest is selected automatically.
        required: true
        type: string
      candidate:
        description: Required for Beta; optional for an atomic Stable package hotfix.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare unprivileged Arch builder
        run: |
          pacman -Syu --noconfirm --needed python curl git openssh sudo namcap gnupg
          useradd --create-home builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: /usr/bin/pacman\n' >/etc/sudoers.d/meo-builder
          chmod 0440 /etc/sudoers.d/meo-builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate release contracts
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          sudo -u builder python scripts/validate_manifest.py "$RELEASE_MANIFEST" --channel "$RELEASE_CHANNEL"
          sudo -u builder python -m unittest discover -s tests -v
      - name: Resolve private source requirements
        id: source-requirements
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
        run: |
          needs_account="$(python - <<'PY'
          import json
          import os
          manifest = json.load(open(os.environ["RELEASE_MANIFEST"], encoding="utf-8"))
          candidate = os.environ.get("RELEASE_CANDIDATE", "")
          print("true" if candidate == "meo-account"
                or (not candidate and "meo-account" in manifest.get("components", {}))
                else "false")
          PY
          )"
          printf 'needs_account=%s\n' "$needs_account" >>"$GITHUB_OUTPUT"
      - name: Install read-only private Account source credential
        if: steps.source-requirements.outputs.needs_account == 'true'
        env:
          MEO_ACCOUNT_DEPLOY_KEY: ${{ secrets.MEO_ACCOUNT_DEPLOY_KEY }}
        run: |
          set +x
          test -n "$MEO_ACCOUNT_DEPLOY_KEY"
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$MEO_ACCOUNT_DEPLOY_KEY" | \
            install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/id_ed25519
          ssh-keyscan github.com | \
            install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/known_hosts
      - name: Resolve candidate against its current signed repositories
        if: inputs.candidate != ''
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: ci/configure-build-repositories.sh "$RELEASE_CHANNEL"
      - name: Build unsigned packages
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
          MEO_ACCOUNT_SOURCE_SSH: ${{ steps.source-requirements.outputs.needs_account == 'true' && '1' || '0' }}
        run: |
          sudo --preserve-env=MEO_ACCOUNT_SOURCE_SSH -u builder ci/build-release.sh \
            "$RELEASE_MANIFEST" "$GITHUB_WORKSPACE/build-output" \
            "$RELEASE_CHANNEL" "$RELEASE_CANDIDATE"
      - name: Remove private Account source credential
        if: always() && steps.source-requirements.outputs.needs_account == 'true'
        run: rm -rf -- /home/builder/.ssh
      - name: Run package metadata checks
        run: bash ci/check-package-metadata.sh build-output/packages
      - name: Upgrade previous public system through the unsigned candidate
        if: inputs.channel == 'stable' && (inputs.candidate == '' || inputs.candidate == 'meo-desktop')
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: ci/upgrade-smoke.sh "$RELEASE_MANIFEST" "$GITHUB_WORKSPACE/build-output"
      - name: Replace the previous public Beta desktop runtime through the unsigned candidate
        if: inputs.channel == 'beta' && inputs.candidate == 'meo-desktop'
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: ci/beta-desktop-replacement-smoke.sh "$RELEASE_MANIFEST" "$GITHUB_WORKSPACE/build-output"
      - name: Run installed Stable train smoke
        if: inputs.channel == 'stable' && inputs.candidate == ''
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: ci/smoke-installed.sh "$RELEASE_MANIFEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            build-output/packages/
            build-output/artifacts.json
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment: release
    concurrency:
      # Keep all channel publication operations serialized.
      group: meo-repository-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ inputs.channel }}-${{ github.run_id }}
          path: build-output
      - name: Install protected publication tooling
        run: pacman -Syu --noconfirm --needed python aws-cli gnupg curl jq pacman-contrib
      - name: Verify artifact identity before importing signing material
        id: publication-preflight
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          digest="$(ci/preflight-publication.sh "$RELEASE_MANIFEST" build-output "$RELEASE_CHANNEL")"
          printf 'contract_sha256=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - name: Import revocable CI signing subkey
        env:
          MEO_GPG_SIGNING_SUBKEY_B64: ${{ secrets.MEO_GPG_SIGNING_SUBKEY_B64 }}
        run: |
          set +x
          test -n "$MEO_GPG_SIGNING_SUBKEY_B64"
          printf '%s' "$MEO_GPG_SIGNING_SUBKEY_B64" | base64 --decode | gpg --batch --import
      - name: Verify, sign, and publish in dependency-safe order
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEO_SIGNING_KEY_FINGERPRINT: ${{ secrets.MEO_SIGNING_KEY_FINGERPRINT }}
          MEO_PUBLICATION_PREFLIGHT_SHA256: ${{ steps.publication-preflight.outputs.contract_sha256 }}
          ALLOW_INITIAL_BETA_REPOSITORY: ${{ inputs.channel == 'beta' && vars.ALLOW_INITIAL_BETA_REPOSITORY || '0' }}
          RELEASE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: ci/publish-repository.sh "$RELEASE_MANIFEST" build-output "$RELEASE_CHANNEL"
      # Beta retains the previous signing authority during this Stable rotation.
      # Do not mutate that unrelated channel as an incidental cleanup action.

  remote-pacman-smoke:
    needs: sign-and-publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install from the signed remote repository
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: |
          pacman -Syu --noconfirm --needed python curl
          ci/remote-smoke.sh "$RELEASE_CHANNEL" "$RELEASE_CANDIDATE" "$RELEASE_MANIFEST"
